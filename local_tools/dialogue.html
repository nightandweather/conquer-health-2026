<script id="markdown-renderer">
// A local, deliberately limited Markdown reader. Every model-supplied byte is
// escaped; only the tags below are generated. Images and raw HTML never execute.
function escapeMarkdownText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function markdownHref(value){
 const raw=value.trim();
 if(/[\u0000-\u0020\u007f-\u009f]/.test(raw)||!/^(https?:\/\/|mailto:)/i.test(raw))return null;
 try{const url=new URL(raw);return ['http:','https:','mailto:'].includes(url.protocol)?url.href:null}catch{return null}
}
function markdownClose(value,start,open,close){
 let depth=1;
 for(let i=start;i<value.length;i++){if(value[i]==='\\'){i++;continue}if(value[i]===open)depth++;if(value[i]===close&&!--depth)return i;}
 return -1;
}
function markdownInline(value,depth=0,links=true){
 if(depth>16)return escapeMarkdownText(value);
 let result='';
 for(let i=0;i<value.length;){
  const lineBreak=value.slice(i).match(/^<br\s*\/?>/i);
  if(lineBreak){result+='<br>';i+=lineBreak[0].length;continue}
  if(value[i]==='\\'&&i+1<value.length&&/[\\`*_{}\[\]()#+\-.!|>~]/.test(value[i+1])){result+=escapeMarkdownText(value[i+1]);i+=2;continue}
  if(value[i]==='`'){
   let length=1;while(value[i+length]==='`')length++;
   const marker='`'.repeat(length),end=value.indexOf(marker,i+length);
   if(end>=0){result+='<code>'+escapeMarkdownText(value.slice(i+length,end).replace(/\n/g,' '))+'</code>';i=end+length;continue}
  }
  const image=value[i]==='!'&&value[i+1]==='[';
  if(links&&(value[i]==='['||image)){
   const start=i+(image?2:1),end=markdownClose(value,start,'[',']');
   if(end>=0&&value[end+1]==='('){
    const closing=markdownClose(value,end+2,'(',')');
    if(closing>=0){
     const label=markdownInline(value.slice(start,end),depth+1,false),destination=value.slice(end+2,closing).trim();
     const match=destination.match(/^(?:<([^<>]+)>|([^\s]+))(?:\s+["'][^"']*["'])?$/);
     const href=match?markdownHref(match[1]||match[2]):null;
     result+=!image&&href?'<a href="'+escapeMarkdownText(href)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>':label;
     i=closing+1;continue;
    }
   }
  }
  if(links&&value[i]==='<'){
   const end=value.indexOf('>',i+1),raw=end>=0?value.slice(i+1,end):'',href=markdownHref(raw);
   if(href){result+='<a href="'+escapeMarkdownText(href)+'" target="_blank" rel="noopener noreferrer">'+escapeMarkdownText(raw)+'</a>';i=end+1;continue}
  }
  let formatted=false;
  for(const [marker,tag] of [['**','strong'],['__','strong'],['~~','del'],['*','em'],['_','em']]){
   if(!value.startsWith(marker,i)||(marker==='_'&&i>0&&/\w/.test(value[i-1])))continue;
   let end=value.indexOf(marker,i+marker.length);
   while(end>=0&&value[end-1]==='\\')end=value.indexOf(marker,end+marker.length);
   if(end>i+marker.length){result+='<'+tag+'>'+markdownInline(value.slice(i+marker.length,end),depth+1,links)+'</'+tag+'>';i=end+marker.length;formatted=true;break;}
  }
  if(formatted)continue;
  result+=value[i]==='\n'?'<br>':escapeMarkdownText(value[i]);i++;
 }
 return result;
}
function markdownCells(line){
 const cells=[];let cell='',escaped=false,ticks=0;
 for(let i=0;i<line.length;i++){
  const c=line[i];
  if(escaped){cell+=c;escaped=false;continue}
  if(c==='\\'){cell+=c;escaped=true;continue}
  if(c==='`'){let length=1;while(line[i+length]==='`')length++;ticks=ticks===length?0:(ticks||length);cell+='`'.repeat(length);i+=length-1;continue}
  if(c==='|'&&!ticks){cells.push(cell.trim());cell=''}else cell+=c;
 }
 cells.push(cell.trim());if(cells[0]==='')cells.shift();if(cells[cells.length-1]==='')cells.pop();return cells;
}
function markdownList(line){const match=line.match(/^( *)([-+*]|\d+[.)])\s+(.*)$/);return match?{indent:match[1].length,ordered:/\d/.test(match[2][0]),number:parseInt(match[2],10),text:match[3]}:null;}
function renderMarkdown(value,depth=0){
 if(depth>16)return '<p>'+escapeMarkdownText(value).replace(/\n/g,'<br>')+'</p>';
 const lines=String(value).replace(/\r\n?/g,'\n').split('\n');let i=0,html='';
 const fence=line=>line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
 const rule=line=>/^ {0,3}(?:(?:\*\s*){3,}|(?:-\s*){3,}|(?:_\s*){3,})$/.test(line);
 const tableAt=n=>{if(n+1>=lines.length||!lines[n].includes('|'))return null;const heads=markdownCells(lines[n]),separators=markdownCells(lines[n+1]);return heads.length&&heads.length===separators.length&&separators.every(c=>/^:?-{3,}:?$/.test(c))?{heads,separators}:null;};
 const blockAt=n=>!lines[n].trim()||fence(lines[n])||/^ {0,3}#{1,6}\s/.test(lines[n])||/^ {0,3}>/.test(lines[n])||markdownList(lines[n])||rule(lines[n])||tableAt(n)||/^( {4}|\t)/.test(lines[n]);
 while(i<lines.length){
  if(!lines[i].trim()){i++;continue}
  const code=fence(lines[i]);
  if(code){const marker=code[1][0],length=code[1].length,content=[];i++;while(i<lines.length&&!new RegExp('^ {0,3}'+marker+'{'+length+',}\\s*$').test(lines[i]))content.push(lines[i++]);if(i<lines.length)i++;html+='<pre><code>'+escapeMarkdownText(content.join('\n'))+'</code></pre>';continue;}
  if(/^( {4}|\t)/.test(lines[i])&&!markdownList(lines[i])){const content=[];while(i<lines.length&&(/^( {4}|\t)/.test(lines[i])||!lines[i].trim()))content.push(lines[i++].replace(/^( {4}|\t)/,''));html+='<pre><code>'+escapeMarkdownText(content.join('\n').replace(/\n+$/,''))+'</code></pre>';continue;}
  const heading=lines[i].match(/^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/);
  if(heading){const level=heading[1].length;html+='<h'+level+'>'+markdownInline(heading[2])+'</h'+level+'>';i++;continue;}
  if(i+1<lines.length&&/^ {0,3}(=+|-+)\s*$/.test(lines[i+1])){const level=lines[i+1].trim()[0]==='='?1:2;html+='<h'+level+'>'+markdownInline(lines[i])+'</h'+level+'>';i+=2;continue;}
  if(rule(lines[i])){html+='<hr>';i++;continue;}
  const table=tableAt(i);
  if(table){
   const align=table.separators.map(c=>c.startsWith(':')&&c.endsWith(':')?'center':c.endsWith(':')?'right':'left');
   const row=(cells,tag)=>'<tr>'+table.heads.map((_,j)=>'<'+tag+' style="text-align:'+align[j]+'">'+markdownInline(cells[j]||'')+'</'+tag+'>').join('')+'</tr>';
   html+='<div class="table-scroll"><table><thead>'+row(table.heads,'th')+'</thead><tbody>';i+=2;
   while(i<lines.length&&lines[i].trim()&&lines[i].includes('|'))html+=row(markdownCells(lines[i++]),'td');
   html+='</tbody></table></div>';continue;
  }
  if(/^ {0,3}>/.test(lines[i])){const content=[];while(i<lines.length&&/^ {0,3}>/.test(lines[i]))content.push(lines[i++].replace(/^ {0,3}> ?/,''));html+='<blockquote>'+renderMarkdown(content.join('\n'),depth+1)+'</blockquote>';continue;}
  const first=markdownList(lines[i]);
  if(first){
   const tag=first.ordered?'ol':'ul';html+='<'+tag+(first.ordered&&first.number!==1?' start="'+Math.min(first.number,1000000)+'"':'')+'>';
   while(i<lines.length){
    const item=markdownList(lines[i]);if(!item||item.indent!==first.indent||item.ordered!==first.ordered)break;
    const content=[item.text];i++;
    while(i<lines.length){
     if(!lines[i].trim()){if(i+1<lines.length&&/^ +\S/.test(lines[i+1])&&lines[i+1].match(/^ */)[0].length>first.indent){content.push('');i++;continue}break;}
     const next=markdownList(lines[i]),indent=lines[i].match(/^ */)[0].length;
     if(indent<=first.indent||(next&&next.indent<=first.indent))break;
     content.push(lines[i++].slice(Math.min(indent,first.indent+2)));
    }
    html+='<li>'+renderMarkdown(content.join('\n'),depth+1)+'</li>';
   }
   html+='</'+tag+'>';continue;
  }
  const content=[lines[i++]];while(i<lines.length&&!blockAt(i)){if(i+1<lines.length&&/^ {0,3}(=+|-+)\s*$/.test(lines[i+1]))break;content.push(lines[i++]);}
  html+='<p>'+markdownInline(content.join('\n'))+'</p>';
 }
 return html;
}
</script>
<script id="comparison-ui">
const token='__LOCAL_TOKEN__';
const defaultArms=['raw_default','lunit_call','grounded_call'];
const labels={raw_default:'기본 설정',lunit_call:'루닛 설정',grounded_call:'개선 설정'};
const statuses={completed:'답변 완료',truncated:'출력 한도로 잘림',failed:'생성 실패',blocked:'연결 차단',not_run:'아직 실행 전',waiting:'차례 대기',generating:'답변 생성 중',received:'기록 저장 중'};
const runStatuses={completed:'완료',partial:'부분 완료',snapshot:'저장된 비교',blocked:'차단',failed:'실패',running:'실행 중',incomplete:'미완료'};
let state=null,selected=0,bottomPinned={},readMode=true,caseSignature='',filteredCases=[],columnSignature='';
const el=id=>document.getElementById(id);
const text=(tag,value,cls)=>{const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node};
function displayArms(){return Array.isArray(state.arms)&&state.arms.length?state.arms:defaultArms;}
function armLabel(arm){return state.read_only&&arm==='grounded_call'?'대조군 · 기존 개선 설정':labels[arm]||(arm.startsWith('codex_guided_')?'Codex 개선 후보 · '+arm:arm);}
function armSettings(arm){
 const config=(state.arm_config||{})[arm]||{},parts=[];
 if(config.prompt_revision)parts.push(String(config.prompt_revision));
 if(config.reasoning_effort)parts.push('추론 '+config.reasoning_effort);
 if(config.temperature!=null)parts.push('temperature '+config.temperature);
 if(config.max_tokens!=null)parts.push('한도 '+config.max_tokens.toLocaleString()+'토큰');
 return parts.join(' · ');
}
function runSummary(){
 const summary=state.run_summary;if(!summary)return '';
 const counts=summary.answer_status_counts||{},parts=[`${state.completed}/${state.planned} 답변 기록`];
 for(const [key,label] of [['completed','완료'],['truncated','잘림'],['failed','실패'],['blocked','차단']])if(counts[key])parts.push(`${label} ${counts[key]}`);
 for(const [key,label] of [['baseline','원본 대조군 실행'],['candidate','후보 실행']]){
  const value=(summary.source_statuses||{})[key];if(value)parts.push(label+' '+(runStatuses[value]||value));
 }
 return parts.join(' · ');
}
function caseTitle(c,i){const question=[...c.messages].reverse().find(m=>m.role==='user');return `${i+1}. ${c.id} · ${(question?question.content:'').replace(/\s+/g,' ').slice(0,72)}`;}
function updateNavigation(){
 const query=el('caseSearch').value.trim().toLowerCase();
 const signature=state.cases.map(c=>c.id).join('|')+'\n'+query;
 if(signature!==caseSignature){
  caseSignature=signature;const options=el('caseSelect');options.replaceChildren();filteredCases=[];
  state.cases.forEach((c,i)=>{if(!query||String(i+1)===query||c.id.toLowerCase().includes(query)||c.messages.some(m=>m.content.toLowerCase().includes(query))){filteredCases.push(i);const option=text('option',caseTitle(c,i));option.value=i;options.append(option)}});
  if(filteredCases.length&&!filteredCases.includes(selected))selected=filteredCases[0];
 }
 const position=filteredCases.indexOf(selected);el('caseSelect').value=String(selected);el('caseSelect').disabled=!filteredCases.length;
 el('prevCase').disabled=position<=0;el('nextCase').disabled=position<0||position>=filteredCases.length-1;
 el('caseCount').textContent=filteredCases.length?`${selected+1} / ${state.cases.length}${query?' · 검색 '+filteredCases.length+'개':''}`:'검색 결과 없음';
}
function render(){
 if(!state)return;
 el('connection').textContent=state.busy?'● 실행 중':'● 로컬 연결';el('connection').className='sub '+(state.busy?'busy':'');
 el('runAll').disabled=state.busy||state.read_only;el('runPair').disabled=state.busy||state.read_only;
 el('runAll').hidden=state.read_only||state.cases.length>3;el('runPair').hidden=Boolean(state.read_only);el('runPair').textContent=state.cases.length>3?`${state.cases.length}문항 기본·개선 비교 (${state.cases.length*2}답변)`:'기본·개선 다시 비교';
 el('pageTitle').textContent=state.read_only?'Codex 개선 전·후 답변 비교':'같은 질문, 세 가지 답변';
 el('modelSettings').textContent=state.read_only?`${state.model} · 저장된 ${displayArms().length}개 설정 · 읽기 전용`:'gpt-oss-20b · 기본 / 루닛 호출 지침 / 사실 보존 지침';
 el('notice').textContent=`복구한 HealthBench 자료 ${state.cases.length}문항의 답변 생성·비교입니다. Codex 검토 점수는 공식 HealthBench 점수가 아닙니다. 개선 설정은 추가 학습이 아닌 호출 지침 변경입니다.`;
 el('viewMode').textContent=readMode?'원문 보기':'읽기 모드';el('viewMode').setAttribute('aria-pressed',String(!readMode));el('modeLabel').textContent=readMode?'읽기 모드 · Markdown':'원문 모드';
 let status=state.error||((state.run?'최근 실행 '+state.run+' · ':'')+(runSummary()||(state.busy?`${state.completed}/${state.planned} 답변 기록`:'대화 기록을 비교할 수 있습니다.')));
 if(state.active){const a=state.active;status+=` · ${a.id} ${armLabel(a.arm)}${a.fallback?' 재호출':''} · ${Math.floor(Date.now()/1000-a.started)}초`;}
 el('status').textContent=status;
 updateNavigation();
 if(!state.cases.length||!filteredCases.length){el('messages').replaceChildren(text('p',state.cases.length?'검색 조건에 맞는 문항이 없습니다.':'불러온 문항이 없습니다.','message empty'));el('columns').hidden=true;return;}
 el('columns').hidden=false;
 const c=state.cases[selected];const messages=el('messages');messages.replaceChildren();
 c.messages.forEach(m=>{messages.append(text('p',{user:'사용자',assistant:'이전 답변',system:'시스템'}[m.role]||m.role,'label'),text('p',m.content,'message'))});
 const columns=el('columns');
 const arms=displayArms(),showLunit=state.read_only||state.cases.length<=3||(c.answers.lunit_call&&c.answers.lunit_call.status!=='not_run');
 const visibleArms=arms.filter(arm=>arm!=='lunit_call'||showLunit);columns.classList.toggle('pair',visibleArms.length===2);
 const signature=arms.join('|');if(columnSignature!==signature){columnSignature=signature;columns.replaceChildren();arms.forEach(arm=>{const card=text('article','','card');card.dataset.arm=arm;const head=text('div','','card-head');head.append(text('h2',armLabel(arm)),text('div','','settings meta'),text('span','','record-status'),text('div','','meta'),text('div','','assessment'));card.append(head,text('div','','answer'),text('div','','run-info'));columns.append(card)})}
 [...columns.children].forEach(card=>{
   const arm=card.dataset.arm,r=c.answers[arm]||{answer:'',status:'not_run'},a=card.querySelector('.answer'),s=card.querySelector('.record-status'),meta=card.querySelector('.card-head > .meta:not(.settings)');
   card.hidden=arm==='lunit_call'&&!showLunit;
   card.querySelector('h2').textContent=armLabel(arm);card.querySelector('.settings').textContent=armSettings(arm);
   const key=c.id+arm;let shouldScroll=bottomPinned[key]!==false;
   if(a.dataset.key!==key){a.dataset.key=key;a.scrollTop=0;bottomPinned[key]=true;shouldScroll=true;}
   a.onscroll=()=>{bottomPinned[key]=a.scrollHeight-a.scrollTop-a.clientHeight<45};
   s.textContent=statuses[r.status]||r.status;s.className='record-status '+r.status;
   let info=r.seconds!=null?`${r.seconds.toFixed(1)}초 · ${r.calls}회 호출`:'';
   if(r.usage&&r.usage.completion_tokens!=null)info+=` · 생성 ${r.usage.completion_tokens.toLocaleString()}토큰`;
   if(r.fallback_used)info+=' · 재호출 사용';meta.textContent=info;
   const assessment=card.querySelector('.assessment'),review=r.assessment;
   const hasScore=review&&Number.isFinite(review.score)&&review.score>=0&&review.score<=100;
   assessment.className='assessment'+(hasScore?' reviewed':'');
   assessment.textContent=hasScore?`Codex 검토 ${Number(review.score.toFixed(1))} / 100 · 공식 점수 아님`:(review&&['needs_review','uncertain'].includes(review.status)?'Codex 추가 검토 필요 · 점수 미정':'Codex 검토 대기 · 점수 미정');
   if(review&&typeof review.note==='string'&&review.note.trim())assessment.textContent+='\n'+review.note.trim();
   const value=r.answer||({waiting:'다른 답변이 끝나면 이어서 생성합니다.',generating:'답변을 준비하고 있습니다…',failed:'결과 기록에서 실패 상태를 확인하세요.'}[r.status]||'비교 실행 후 답변이 여기에 표시됩니다.');
   const mode=readMode&&r.answer?'read':'raw';
   if(a._answerSource!==value||a.dataset.mode!==mode){
    const scroll=a.scrollTop;a.dataset.mode=mode;a._answerSource=value;
    a.classList.toggle('read-mode',mode==='read');a.classList.toggle('empty',!r.answer);
    if(mode==='read')a.innerHTML=renderMarkdown(value);else a.textContent=value;
    a.scrollTop=r.status==='generating'&&shouldScroll?a.scrollHeight:scroll;
   }
   card.querySelector('.run-info').textContent=(r.run||'기록 없음')+(r.source_run?' · 원본 '+r.source_run:'');
 });
}
async function poll(){try{const r=await fetch('/api/state',{headers:{'X-Local-Token':token},cache:'no-store'});if(!r.ok)throw Error();state=await r.json();selected=Math.min(selected,Math.max(0,state.cases.length-1));render();}catch{el('connection').textContent='연결 확인 필요';el('status').textContent='로컬 비교 서버 연결을 확인하세요.';}finally{setTimeout(poll,1500)}}
async function run(arms){el('runAll').disabled=true;el('runPair').disabled=true;try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify({arms})});const d=await r.json();if(!r.ok)throw Error(d.error);el('status').textContent='비교를 시작합니다.';}catch(e){el('status').textContent=e.message;el('runAll').disabled=false;el('runPair').disabled=false}}
el('caseSelect').onchange=()=>{selected=Number(el('caseSelect').value);render()};
el('caseSearch').oninput=()=>render();
el('prevCase').onclick=()=>{const i=filteredCases.indexOf(selected);if(i>0){selected=filteredCases[i-1];render()}};
el('nextCase').onclick=()=>{const i=filteredCases.indexOf(selected);if(i>=0&&i<filteredCases.length-1){selected=filteredCases[i+1];render()}};
el('viewMode').onclick=()=>{readMode=!readMode;render()};
el('runAll').onclick=()=>run(defaultArms);el('runPair').onclick=()=>run(['raw_default','grounded_call']);poll();
</script>
