<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealthBench 대화 비교</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#10131a;color:#e9edf4}
*{box-sizing:border-box}body{margin:0}header{padding:24px 24px 18px;border-bottom:1px solid #29303e;background:#151923;position:sticky;top:0;z-index:5}
.eyebrow{font-size:11px;letter-spacing:2px;color:#95b3d9}h1{font-size:23px;margin:8px 0}p{line-height:1.6}.sub{color:#aab5c6;font-size:12px;margin:0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.dot{width:8px;height:8px;border-radius:100%;background:#7de4ba;display:inline-block;margin-right:6px}.busy .dot{background:#ffca75;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
button{font:inherit;cursor:pointer;border:1px solid #425571;border-radius:9px;padding:10px 14px;background:#263d59;color:#eff5ff;font-size:12px}button:hover{background:#324e70}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.secondary{background:transparent}.status{font-size:12px;color:#d4e2f4;margin-top:14px;min-height:18px}.notice{padding:10px 24px;background:#1c2430;color:#afbfd3;font-size:11px;line-height:1.6}
main{padding:18px 24px 40px;max-width:1600px;margin:auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{background:transparent;flex:1}.tab.selected{background:#263d59;border-color:#83b8ec}.question{border:1px solid #303a4a;border-radius:12px;padding:15px 18px;background:#171d28;margin-bottom:15px}.label{font-size:11px;color:#89a6c8;margin:0 0 8px}.message{white-space:pre-wrap;font-size:14px;line-height:1.6;margin:0;overflow-wrap:anywhere}
.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #303a4a;border-radius:12px;overflow:hidden;background:#151b25;min-width:0}.card-head{padding:14px 15px;border-bottom:1px solid #293344;background:#1a2330}.card h2{font-size:15px;margin:0 0 6px}.meta{font-size:11px;color:#acbed5;line-height:1.65;min-height:32px}.record-status{display:inline-block;padding:3px 6px;border-radius:5px;background:#273847;color:#9be9c6;font-size:10px;margin-bottom:6px}.record-status.truncated,.record-status.failed{background:#493e2b;color:#ffd28a}.record-status.generating{background:#254866;color:#b4defd}.answer{padding:17px;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;min-height:220px;max-height:66vh;overflow:auto}.empty{color:#7f94af}.run-info{padding:9px 15px;border-top:1px solid #283140;color:#8496ae;font-size:10px;overflow-wrap:anywhere}
@media(max-width:760px){header{padding:17px}main{padding:14px 16px}.notice{padding:9px 17px}.columns{grid-template-columns:1fr}.answer{max-height:44vh}.card-head{position:sticky;top:0}.topline{align-items:flex-start}}
</style>
</head>
<body>
<header>
<div class="topline"><div><div class="eyebrow">LOCAL MODEL · HEALTHBENCH</div><h1>같은 질문, 세 가지 답변</h1></div><span class="sub" id="connection"><i class="dot"></i>연결 중</span></div>
<p class="sub">gpt-oss-20b · 기본 / 루닛 호출 지침 / 사실 보존 지침</p>
<div class="actions"><button id="runAll">세 설정 모두 비교</button><button id="runPair" class="secondary">기본·개선 다시 비교</button></div>
<div class="status" id="status">기존 대화 기록을 불러오는 중입니다.</div>
</header>
<div class="notice">복구한 HealthBench 자료의 3문항 동작 비교입니다. 기준별 채점 전이며, 개선 설정은 추가 학습이 아닌 호출 지침 변경입니다.</div>
<main><div class="tabs" id="tabs"></div><section class="question"><p class="label">대화 입력</p><div id="messages"></div></section><div class="columns" id="columns"></div></main>
<script>
const token='__LOCAL_TOKEN__';
const arms=['raw_default','lunit_call','grounded_call'];
const labels={raw_default:'기본 설정',lunit_call:'루닛 설정',grounded_call:'개선 설정'};
const statuses={completed:'답변 완료',truncated:'출력 한도로 잘림',failed:'생성 실패',blocked:'연결 차단',not_run:'아직 실행 전',waiting:'차례 대기',generating:'답변 생성 중',received:'기록 저장 중'};
let state=null,selected=0,bottomPinned={};
const el=id=>document.getElementById(id);
const text=(tag,value,cls)=>{const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node};
function render(){
 if(!state)return;
 el('connection').textContent=state.busy?'● 실행 중':'● 로컬 연결';el('connection').className='sub '+(state.busy?'busy':'');
 el('runAll').disabled=state.busy;el('runPair').disabled=state.busy;
 let status=state.error||((state.run?'최근 실행 '+state.run+' · ':'')+(state.busy?`${state.completed}/${state.planned} 답변 기록`:'대화 기록을 비교할 수 있습니다.'));
 if(state.active){const a=state.active;status+=` · ${a.id} ${labels[a.arm]}${a.fallback?' 재호출':''} · ${Math.floor(Date.now()/1000-a.started)}초`;}
 el('status').textContent=status;
 const tabs=el('tabs');if(!tabs.children.length)state.cases.forEach((c,i)=>{const b=text('button',`문항 ${i+1}`,'tab');b.onclick=()=>{selected=i;render()};tabs.append(b)});
 [...tabs.children].forEach((b,i)=>b.classList.toggle('selected',i===selected));
 const c=state.cases[selected];const messages=el('messages');messages.replaceChildren();
 c.messages.forEach(m=>{messages.append(text('p',m.role==='user'?'사용자':'이전 대화','label'),text('p',m.content,'message'))});
 const columns=el('columns');
 if(!columns.children.length)arms.forEach(arm=>{const card=text('article','','card');card.dataset.arm=arm;const head=text('div','','card-head');head.append(text('h2',labels[arm]),text('span','','record-status'),text('div','','meta'));card.append(head,text('div','','answer'),text('div','','run-info'));columns.append(card)});
 [...columns.children].forEach(card=>{
   const arm=card.dataset.arm,r=c.answers[arm],a=card.querySelector('.answer'),s=card.querySelector('.record-status'),meta=card.querySelector('.meta');
   const key=c.id+arm;const shouldScroll=bottomPinned[key]!==false;
   if(a.dataset.key!==key){a.dataset.key=key;a.scrollTop=0;bottomPinned[key]=true;}
   a.onscroll=()=>{bottomPinned[key]=a.scrollHeight-a.scrollTop-a.clientHeight<45};
   s.textContent=statuses[r.status]||r.status;s.className='record-status '+r.status;
   let info=r.seconds!=null?`${r.seconds.toFixed(1)}초 · ${r.calls}회 호출`:'';
   if(r.usage&&r.usage.completion_tokens!=null)info+=` · 생성 ${r.usage.completion_tokens.toLocaleString()}토큰`;
   if(r.fallback_used)info+=' · 재호출 사용';meta.textContent=info;
   const value=r.answer||({waiting:'다른 답변이 끝나면 이어서 생성합니다.',generating:'답변을 준비하고 있습니다…',failed:'결과 기록에서 실패 상태를 확인하세요.'}[r.status]||'비교 실행 후 답변이 여기에 표시됩니다.');
   if(a.textContent!==value){a.textContent=value;a.classList.toggle('empty',!r.answer);if(r.status==='generating'&&shouldScroll)a.scrollTop=a.scrollHeight;}
   card.querySelector('.run-info').textContent=r.run||'기록 없음';
 });
}
async function poll(){try{const r=await fetch('/api/state',{headers:{'X-Local-Token':token},cache:'no-store'});if(!r.ok)throw Error();state=await r.json();render();}catch{el('connection').textContent='연결 확인 필요';el('status').textContent='로컬 비교 서버 연결을 확인하세요.';}finally{setTimeout(poll,700)}}
async function run(arms){el('runAll').disabled=true;el('runPair').disabled=true;try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify({arms})});const d=await r.json();if(!r.ok)throw Error(d.error);el('status').textContent='비교를 시작합니다.';}catch(e){el('status').textContent=e.message;el('runAll').disabled=false;el('runPair').disabled=false}}
el('runAll').onclick=()=>run(arms);el('runPair').onclick=()=>run(['raw_default','grounded_call']);poll();
</script>
</body></html>
